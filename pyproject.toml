[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Sprint_n"
version = "0.1.0"
description = "UI automation tests for Yandex Routes"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "xfail: mark tests that expose known bugs",
]
